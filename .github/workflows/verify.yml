name: Verify

# 手动触发的构建/测试流水线，避免自动消耗 Actions 分钟。
# 需要 PostgreSQL 集成测试时勾选 run_integration。
on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: '运行 PostgreSQL 集成测试'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: 'Build, vet, test'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gobackendcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gobackendcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -short -count=1 ./...

      - name: PostgreSQL integration tests
        if: inputs.run_integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gobackendcore_test?sslmode=disable
        run: |
          go test -count=1 -v -run 'TestApplyMigrations|TestPostgres|TestRepository|TestPMRepository' \
            ./internal/testutil ./internal/services/audit ./internal/services/feature \
            ./internal/services/auth ./internal/services/outbox ./internal/modules/webhook \
            ./internal/modules/servicenav ./zzz/developmentManager
