# 手动发布流水线：仅在 Actions 配额可用时由人工触发
# 触发条件（双保险）：
#   1. 仅 workflow_dispatch（不会因 push/tag 自动消耗 Actions 分钟）
#   2. 仓库变量 ENABLE_GHCR_BUILD 必须为 true，否则任务直接 skipped（不分配 runner、不消耗分钟）
# 配额不可用/不想消耗时：不设置该变量，或在 GitHub Settings → Variables 中置为 false

name: Manual Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签（如 latest / v1.0.0）'
        required: true
        default: latest
      push_latest:
        description: '同时更新 latest 标签'
        type: boolean
        default: true
      run_checks:
        description: '构建前运行 go vet / go test -short（会增加耗时）'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/allinost/go-backend-core

jobs:
  release:
    name: 'Build & Push GHCR'
    if: vars.ENABLE_GHCR_BUILD == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.run_checks
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Go vet
        if: inputs.run_checks
        run: go vet ./...

      - name: Go test (short)
        if: inputs.run_checks
        run: go test -short -count=1 ./...

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
            type=sha,prefix=sha-

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
