services:
  goodser-vision:
    build:
      context: .
      dockerfile: Dockerfile.real
      args:
        # 默认 GPU 版 Paddle；构建失败可改成 requirements-real-cpu.txt
        PADDLE_REQUIREMENTS: ${PADDLE_REQUIREMENTS:-requirements-real-gpu.txt}
    image: goodser-vision:0.1.0-gpu
    container_name: goodser-vision
    restart: unless-stopped
    # 真正把 env.real 注入容器；不需要再手动 export
    env_file:
      - ./env.real
    ports:
      # 固定：宿主机 58000 → 容器 8000
      # 生产只走 1panel-network 时可改成 "127.0.0.1:58000:8000" 或删除 ports
      - "0.0.0.0:58000:8000"
    environment:
      # 容器内路径固定；其余应用配置全部由 env_file（env.real）注入
      HF_HOME: /app/hf-cache
      PADDLEOCR_HOME: /app/paddle-cache
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128
    volumes:
      - ./models:/app/models
      - ./hf-cache:/app/hf-cache
      - ./paddle-cache:/app/paddle-cache
      - ./data:/app/data
    shm_size: "2gb"
    networks:
      1panel-network:
        aliases:
          - goodser-vision
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  # 1Panel 已创建的外部网络；后端容器也在该网络中
  1panel-network:
    external: true
