services:
  goodser-vision:
    build:
      context: .
      dockerfile: Dockerfile.real
      args:
        # 默认 GPU 版 Paddle；构建失败可改成 requirements-real-cpu.txt
        PADDLE_REQUIREMENTS: ${PADDLE_REQUIREMENTS:-requirements-real-gpu.txt}
    image: goodser-vision:0.1.0-gpu
    container_name: goodser-vision
    restart: unless-stopped
    ports:
      - "${GOODSER_VISION_BIND:-127.0.0.1}:${GOODSER_VISION_PORT:-8000}:8000"
    environment:
      DEVICE: "${DEVICE:-cuda}"
      GOODSER_VISION_EMBEDDER: "${GOODSER_VISION_EMBEDDER:-clip}"
      GOODSER_VISION_DETECTOR: "${GOODSER_VISION_DETECTOR:-yolo}"
      GOODSER_VISION_EMBED_DIM: "${GOODSER_VISION_EMBED_DIM:-512}"
      GOODSER_VISION_MAX_CONCURRENCY: "${GOODSER_VISION_MAX_CONCURRENCY:-1}"
      GOODSER_VISION_MAX_IMAGE_SIDE: "${GOODSER_VISION_MAX_IMAGE_SIDE:-1920}"
      GOODSER_VISION_MODEL_DIR: "${GOODSER_VISION_MODEL_DIR:-/app/models}"
      GOODSER_VISION_WARMUP: "${GOODSER_VISION_WARMUP:-1}"
      GOODSER_VISION_IDLE_UNLOAD_SECONDS: "${GOODSER_VISION_IDLE_UNLOAD_SECONDS:-0}"
      GOODSER_VISION_IDLE_CHECK_SECONDS: "${GOODSER_VISION_IDLE_CHECK_SECONDS:-30}"
      GOODSER_VISION_GPU_MEMORY_FRACTION: "${GOODSER_VISION_GPU_MEMORY_FRACTION:-0.5}"
      GOODSER_VISION_GPU_HEADROOM_MB: "${GOODSER_VISION_GPU_HEADROOM_MB:-1024}"
      # VLM 全局：默认关闭
      GOODSER_VISION_VLM_ENABLED: "${GOODSER_VISION_VLM_ENABLED:-0}"
      GOODSER_VISION_VLM_MODE: "${GOODSER_VISION_VLM_MODE:-auto}"
      GOODSER_VISION_VLM_COOLDOWN_SECONDS: "${GOODSER_VISION_VLM_COOLDOWN_SECONDS:-60}"
      GOODSER_VISION_VLM_TIMEOUT_SECONDS: "${GOODSER_VISION_VLM_TIMEOUT_SECONDS:-60}"
      GOODSER_VISION_VLM_MAX_IMAGE_SIDE: "${GOODSER_VISION_VLM_MAX_IMAGE_SIDE:-1280}"
      GOODSER_VISION_VLM_MAX_TOKENS: "${GOODSER_VISION_VLM_MAX_TOKENS:-512}"
      # VLM 主槽位
      GOODSER_VISION_VLM_PRIMARY_ENABLED: "${GOODSER_VISION_VLM_PRIMARY_ENABLED:-0}"
      GOODSER_VISION_VLM_PRIMARY_PROVIDER: "${GOODSER_VISION_VLM_PRIMARY_PROVIDER:-disabled}"
      GOODSER_VISION_VLM_PRIMARY_BASE_URL: "${GOODSER_VISION_VLM_PRIMARY_BASE_URL:-}"
      GOODSER_VISION_VLM_PRIMARY_API_KEY: "${GOODSER_VISION_VLM_PRIMARY_API_KEY:-}"
      GOODSER_VISION_VLM_PRIMARY_MODEL: "${GOODSER_VISION_VLM_PRIMARY_MODEL:-}"
      # VLM 备槽位
      GOODSER_VISION_VLM_BACKUP_ENABLED: "${GOODSER_VISION_VLM_BACKUP_ENABLED:-0}"
      GOODSER_VISION_VLM_BACKUP_PROVIDER: "${GOODSER_VISION_VLM_BACKUP_PROVIDER:-disabled}"
      GOODSER_VISION_VLM_BACKUP_BASE_URL: "${GOODSER_VISION_VLM_BACKUP_BASE_URL:-}"
      GOODSER_VISION_VLM_BACKUP_API_KEY: "${GOODSER_VISION_VLM_BACKUP_API_KEY:-}"
      GOODSER_VISION_VLM_BACKUP_MODEL: "${GOODSER_VISION_VLM_BACKUP_MODEL:-}"
      GOODSER_VISION_VLM_CONFIG_FILE: "${GOODSER_VISION_VLM_CONFIG_FILE:-data/vlm.json}"
      # OCR：默认 GPU，初始化失败自动回退 CPU
      GOODSER_VISION_OCR_ENABLED: "${GOODSER_VISION_OCR_ENABLED:-1}"
      GOODSER_VISION_OCR_DEVICE: "${GOODSER_VISION_OCR_DEVICE:-gpu}"
      GOODSER_VISION_OCR_LANG: "${GOODSER_VISION_OCR_LANG:-ch}"
      HF_HOME: /app/hf-cache
      PADDLEOCR_HOME: /app/paddle-cache
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128
    volumes:
      - ./models:/app/models
      - ./hf-cache:/app/hf-cache
      - ./paddle-cache:/app/paddle-cache
      - ./data:/app/data
    shm_size: "2gb"
    networks:
      1panel-network:
        aliases:
          - goodser-vision
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  # 1Panel 已创建的外部网络；后端容器也在该网络中
  1panel-network:
    external: true
