groups:
  - name: go-backend-core
    rules:
      - alert: AppDown
        expr: up{job="go-backend-core"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Go-Backend-Core 不可达"
          description: "Prometheus 连续 2 分钟无法抓取 {{ $labels.instance }}"

      - alert: AppHigh5xxRate
        expr: |
          (
            sum(rate(http_requests_total{job="go-backend-core",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="go-backend-core"}[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx 比例超过 5%"
          description: "当前 5xx 比例 {{ $value | humanizePercentage }}"

      - alert: AppDBPoolExhausted
        expr: go_backend_core_health_db_connections{state="in_use"} > 0.9 * go_backend_core_health_db_connections{state="open"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池接近耗尽"
          description: "instance={{ $labels.instance }} in_use 接近 open"

  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL 不可达"
          description: "{{ $labels.instance }} pg_up=0"

      - alert: PostgresConnectionsHigh
        expr: |
          sum by (instance) (pg_stat_activity_count) 
          / 
          max by (instance) (pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 连接数超过 80%"
          description: "{{ $labels.instance }} 连接使用率 {{ $value | humanizePercentage }}"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL 复制延迟超过 60s"
          description: "{{ $labels.instance }} lag={{ $value }}s"

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 出现死锁"
          description: "{{ $labels.datname }} 10 分钟内出现死锁"

      - alert: PostgresSlowQueries
        expr: rate(pg_stat_statements_seconds_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 慢查询耗时上升"
          description: "pg_stat_statements 每秒耗时 {{ $value }}s（需启用 pg_stat_statements）"
