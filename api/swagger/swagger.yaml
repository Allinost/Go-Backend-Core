              type: object
        "404":
          description: 商品不存在
          schema:
            $ref: '#/definitions/github_com_Allinost_go-backend-core_internal_pkg_response.Response'
      summary: 获取商品详情
      tags:
      - shopchecker
    put:
      consumes:
      - application/json
      description: 更新商品监控配置，仅传入需要修改的字段即可（部分更新）
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
