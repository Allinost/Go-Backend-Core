        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zzz_shopchecker.UpdateProductReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Allinost_go-backend-core_internal_pkg_response.Response'
            - properties:
                data:
