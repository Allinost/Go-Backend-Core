  /shopchecker/products:
    get:
      consumes:
      - application/json
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 100
        in: query
        name: page_size
        type: integer
      - description: 筛选平台：jd（京东桌面版）/ jdm（京东移动版）/ taobao（淘宝）/ pdd（拼多多）/ qixian（七鲜）
        in: query
        name: platform
        type: string
      - description: 搜索关键词，匹配商品名称
        in: query
        name: keyword
        type: string
      - description: 筛选启用状态
        in: query
        name: enabled
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Allinost_go-backend-core_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/zzz_shopchecker.PaginatedResp-zzz_shopchecker_Product'
              type: object
      summary: 获取商品列表
      tags:
      - shopchecker
    post:
      consumes:
      - application/json
      description: |-
        创建一个新的商品价格监控任务。支持以下平台和 URL 格式：
        - platform: jd（京东桌面版）、jdm（京东移动版）、taobao（淘宝/天猫）、pdd（拼多多）、qixian（七鲜）
        - url: 商品页完整 URL、分享短链接（如 e.tb.cn/xxx）、或含 ID 的链接均可自动识别
        - check_interval: 检查间隔，如 "1h"（1小时）、"30m"（30分钟）、"24h"（24小时），默认 "1h"
        - target_price: 目标价格，当现价低于此值时触发通知（淘宝同时支持国补/百亿补贴后价格对比）
        - price_drop_ratio: 降价百分比阈值，降幅达到此比例时触发通知
        - cron_expr: cron 表达式，优先级高于 check_interval（如 "0 9 * * *" 表示每天 9 点检查）
      parameters:
      - description: 商品监控配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zzz_shopchecker.CreateProductReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Allinost_go-backend-core_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/zzz_shopchecker.Product'
              type: object
        "400":
          description: 参数错误（平台不支持/URL 无效/间隔格式错误）
          schema:
            $ref: '#/definitions/github_com_Allinost_go-backend-core_internal_pkg_response.Response'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/github_com_Allinost_go-backend-core_internal_pkg_response.Response'
      summary: 创建商品监控
      tags:
      - shopchecker
  /shopchecker/products/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Allinost_go-backend-core_internal_pkg_response.Response'
      summary: 删除商品监控
      tags:
      - shopchecker
    get:
      consumes:
      - application/json
      description: 获取单个商品监控的完整配置信息，包含当前价格、上次检查时间、下次检查时间等
      parameters:
      - description: 商品 ID
